name: allocator checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make PROFILE=asan all test -j2 CXX=clang++
  thread-sanitizer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make PROFILE=tsan bin/tsan/poolConcurrencyTest CXX=clang++
      - run: ./bin/tsan/poolConcurrencyTest
  benchmark-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make PROFILE=release bench -j2 CXX=clang++
      - run: python3 tests/benchmarkHarnessTest.py bin/release/allocBench
      - run: python3 tools/bench_report.py --allocators=empty,new,cached,numa --threads=1 --sizes=64 --live=16 --iters=2000 --repetitions=2
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ matrix.os }}
          path: benchmark-results/
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make fuzz-smoke FUZZ_RUNS=10000 FUZZ_SECONDS=30
      - run: make PROFILE=asan bin/asan/allocatorSequenceTest CXX=clang++
      - run: ./bin/asan/allocatorSequenceTest --seed=20261119 --cases=1000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus-and-failures
          path: |
            build/fuzz/corpus/
            build/fuzz/artifacts/
